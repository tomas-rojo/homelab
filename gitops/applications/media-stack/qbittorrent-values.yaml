# qBittorrent - download client.
#
# The init container recreates the TRaSH directory tree on the shared volume, so
# a brand-new PVC starts with the right layout. It replaces
# scripts/init-data-dirs.sh from the Docker Compose stack. Running it here (and
# not in Sonarr/Radarr) keeps a single writer for the mount points.
#
# It runs as root on purpose: the Longhorn CSI driver only applies fsGroup to
# ReadWriteOnce volumes, so the RWX media volume arrives root-owned. The chown
# touches only the top-level directories; everything nested below is created by
# the apps themselves (uid 1000).
#
# Only /data/torrents is mounted into the app itself: qBittorrent never touches
# the library, the *arr apps move finished downloads out with hardlinks.
global:
  fullnameOverride: qbittorrent

defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    initContainers:
      init-media-dirs:
        image:
          repository: docker.io/library/busybox
          tag: 1.37.0
        command:
          - sh
          - -c
          - >-
            mkdir -p
            /data/torrents/movies /data/torrents/series /data/torrents/music
            /data/media/movies /data/media/series /data/media/music &&
            chown 1000:1000 /data/torrents /data/media &&
            chown 1000:1000 /data/torrents/* /data/media/*
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: 5.3.0
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Amsterdam
          WEBUI_PORT: "8080"
          TORRENTING_PORT: "6881"
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 8080
          readiness:
            enabled: true
            type: TCP
            port: 8080
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  main:
    ports:
      http:
        port: 8080

persistence:
  config:
    existingClaim: qbittorrent-config
    globalMounts:
      - path: /config
  data:
    existingClaim: media-data
    advancedMounts:
      main:
        init-media-dirs:
          - path: /data
        main:
          - path: /data/torrents
            subPath: torrents
