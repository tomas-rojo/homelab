# Envoy Gateway replaces Caddy here. Instead of path-prefix routing on a single
# host (`/sonarr`, `/radarr`, ...) every app gets its own subdomain under the
# *.home wildcard certificate, so no app needs a Base URL / UrlBase setting.
#
# FlareSolverr intentionally has no route: it is only reached by Sonarr/Radarr
# over the in-cluster Service `http://flaresolverr:8191`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-route
  namespace: media
spec:
  parentRefs:
    - name: gateway-api
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - jellyfin.home
  rules:
    # Envoy Gateway applies a 15s request timeout by default, which kills long
    # playback/streaming responses. Disable it for the media server only.
    - timeouts:
        request: 0s
      backendRefs:
        - name: jellyfin
          port: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-route
  namespace: media
spec:
  parentRefs:
    - name: gateway-api
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - sonarr.home
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
---
