# Shared media volume.
#
# ReadWriteMany on purpose: Sonarr, Radarr, qBittorrent, Bazarr and Jellyfin all
# mount the same volume, and the *arr imports rely on hardlinks between
# /data/torrents and /data/media. Longhorn serves RWX through a share-manager
# (NFS), which keeps a single filesystem underneath, so hardlinks and atomic
# renames keep working across pods.
#
# 200Gi is a starting point: the volume is expandable in place (the
# longhorn-media StorageClass sets allowVolumeExpansion).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-media
  resources:
    requests:
      storage: 200Gi
---
# Per-app config volumes. SQLite databases, settings and Jellyfin metadata live
# here; media files never do.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-media
  resources:
    requests:
      storage: 2Gi
---
