serviceDns:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.232
  annotations:
    metallb.universe.tf/address-pool: public-pool
    metallb.universe.tf/allow-shared-ip: pihole-dns

# Peak working set 77Mi over 10d (p95 72Mi).
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 192Mi

extraVolumes:
  local-dns:
    configMap:
      name: pihole-local-dns

extraVolumeMounts:
  local-dns:
    mountPath: /etc/pihole/hosts/custom.list
    subPath: custom.list
    readOnly: true
