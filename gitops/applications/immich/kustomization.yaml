apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

resources:
  - pvc.yaml
  - pg-secret.yaml
  - pg-cluster.yaml
  - pg-user.yaml
  - ts-service.yaml
  - backup-sa.yaml
  - backup-cronjob.yaml

helmCharts:
  - name: immich
    version: 0.12.0
    repo: "https://immich-app.github.io/immich-charts"
    releaseName: immich
    valuesFile: values.yaml
