controllers:
  main:
    containers:
      main:
        image:
          tag: v2.6.0
        env:
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: host
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: user
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: dbname
immich:
  metrics:
    enabled: false
  persistence:
    library:
      existingClaim: immich-data-pvc
  configuration: {}

# Dependencies
valkey:
  enabled: true
  # Peak working set 13Mi over 10d.
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi

# Immich components
server:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-server
    pullPolicy: IfNotPresent
  # Peak working set 2842Mi over 10d (p95 2704Mi). Chart 0.12.0 is bjw-s
  # app-template based: resources MUST live under controllers.main.containers.main,
  # a top-level `server.resources` block is silently ignored.
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: 3Gi
            limits:
              memory: 4Gi
  ingress:
    main:
      enabled: false
  service:
    main:
      type: LoadBalancer
      loadBalancerIP: 192.168.1.233

machine-learning:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    pullPolicy: IfNotPresent
  # Peak working set 1069Mi over 10d (p95 721Mi).
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
  env:
    TRANSFORMERS_CACHE: /cache
  persistence:
    cache:
      enabled: true
      size: 10Gi
      existingClaim: immich-ml-pvc
