crds:
  enabled: true
upgradeJob:
  enabled: true
  forceConflicts: true

# Cardinality audit (14d): 196k active series, 13.4GiB TSDB, 1.9Gi RSS.
# 76% of those series are control-plane metrics, and k3s serves them from TWO
# endpoints: the real one (:6443, job="apiserver") and the kubelet one
# (:10250/metrics, job="kubelet"), which k3s cross-exports. The kubelet copy
# alone is 90k series (46%) and is also unpruned, since the bucket-pruning
# defaults only apply to the apiserver ServiceMonitor.
# NOTE: Helm replace-lists arrays, so these charts' defaults have to be
# restated here or they are silently lost.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # Keep this first: chart default that prunes rarely-used latency buckets.
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels:
          - __name__
          - le
      # Whole histograms nothing here reads. apiserver_request_duration_seconds_bucket
      # is deliberately NOT listed -- the stock Grafana API server dashboards use it.
      - action: drop
        regex: apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_events_sizes_bucket|scheduler_plugin_execution_duration_seconds_bucket
        sourceLabels:
          - __name__

kubelet:
  serviceMonitor:
    metricRelabelings:
      # Chart default: prune kubelet storage operation buckets.
      - action: drop
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        sourceLabels:
          - __name__
          - le
      # Control-plane metrics cross-exported by k3s on the kubelet port. The
      # authoritative copies arrive from job="apiserver"/"etcd"/"scheduler";
      # keeping both halves them and double-counts every rate() and
      # histogram_quantile() on the API server dashboards.
      - action: drop
        regex: apiserver_.*|etcd_.*|scheduler_.*
        sourceLabels:
          - __name__

# Memory requests/limits sized from 10d of in-cluster Prometheus data:
# request = p95 working set x1.2, limit = peak working set x1.4.
prometheus:
  prometheusSpec:
    # Peak 2098Mi (p95 1518Mi). NOTE: the TSDB head grows with active series --
    # revisit this limit if scrape targets are added.
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi
    # Measured ~1.15Gi/day (236k series @ 30s scrape, ~429Mi WAL per 2.3h);
    # 14d retention needs ~16Gi, sized to 25Gi for compaction spikes.
    retention: 14d

prometheusOperator:
  # Peak 40Mi.
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi
  prometheusConfigReloader:
    # Peak 20Mi.
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 64Mi

alertmanager:
  alertmanagerSpec:
    # Peak 30Mi (chart default requests 200Mi).
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi

kube-state-metrics:
  # Peak 36Mi.
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # Peak 21Mi.
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 64Mi

grafana:
  defaultDashboardsTimezone: Europe/Amsterdam
  # Peak 485Mi (p95 212Mi).
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 768Mi
  sidecar:
    # sc-dashboard and sc-datasources, peak 90Mi each.
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 192Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  admin:
    existingSecret: grafana-admin-credentials
    passwordKey: admin-password
