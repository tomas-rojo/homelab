apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-media
provisioner: driver.longhorn.io
allowVolumeExpansion: true   # Grow the library volume in place instead of migrating it
reclaimPolicy: Retain        # Keep media if a PVC is deleted by mistake
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  nodeSelector: "media" # replica placement is restricted to Longhorn nodes only k8s-wk-01
  staleReplicaTimeout: "30"
