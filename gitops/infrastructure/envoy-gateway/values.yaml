topologyInjector:
  enabled: false # Disabled because initial certgen job was failing

# Control plane. Peak working set 75Mi over 10d; chart default requests 256Mi.
# CPU request left at the chart default of 100m (memory-only rightsizing).
deployment:
  envoyGateway:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 192Mi
